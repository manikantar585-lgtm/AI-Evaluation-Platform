# Runs the unit tests, then an evaluation gate: the build fails if the
# pass rate drops below the threshold. Swap --predictions for --target to
# evaluate a live model (add GROQ_API_KEY as a repository secret).
name: tests-and-eval
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Eval gate (RAG answers must pass >= 90%)
        run: |
          python -m app.cli run \
            --dataset examples/datasets/coaching-rag-qa.jsonl \
            --predictions examples/predictions/coaching-prompt-v2.json \
            --fail-under 0.9
